<ion-content [fullscreen]="true" class="login-content" [scrollY]="false">
  <div class="login-container">
    <div class="logo-section">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <h1>Welcome Back</h1>
      <p>Sign in to continue</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>
        <ion-item lines="none" class="custom-item">
          <ion-icon slot="start" name="location-outline"></ion-icon>

          <ion-select
            placeholder="Select Location"
            [(ngModel)]="selectedLocation"
            interface="popover"
          >
            <ion-select-option value="lahore">Lahore</ion-select-option>
            <ion-select-option value="islamabad">Islamabad</ion-select-option>
            <ion-select-option value="karachi">Karachi</ion-select-option>
            <ion-select-option value="rawalpindi">Rawalpindi</ion-select-option>
            <ion-select-option value="faisalabad">Faisalabad</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item lines="none" class="custom-item">
          <ion-icon slot="start" name="person-outline"></ion-icon>
          <ion-input type="text" placeholder="Username"> </ion-input>
        </ion-item>

        <ion-item lines="none" class="custom-item">
          <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
          <ion-input type="password" placeholder="Password"> </ion-input>
        </ion-item>

        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>

        <ion-button expand="block" class="login-btn" (click)="login()">
          Login
        </ion-button>

        <!-- <div class="divider">
          <span>OR</span>
        </div> -->

        <!-- <ion-button expand="block" fill="outline" class="google-btn">
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Continue with Google
        </ion-button>

        <div class="signup-link">
          Don't have an account?
          <a href="#">Sign Up</a>
        </div> -->
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
